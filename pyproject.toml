[project]
name = "talab"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "ephem>=4.2.1",
    "matplotlib>=3.11.2",
    "numba>=0.68.1",
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "requests>=2.34.2",
    "scipy>=1.17.1",
    "yfinance>=1.8.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
